services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: educluster-api
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4203}
    ports:
      - "4201:8000"
    depends_on:
      - mlflow
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: educluster-mlflow
    volumes:
      - ./mlruns:/mlflow/mlruns
    ports:
      - "4202:5000"
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4201}
        VITE_MLFLOW_URL: ${VITE_MLFLOW_URL:-http://localhost:4202}
    ports:
      - "${DASHBOARD_PORT:-4203}:80"
    depends_on:
      - api
    restart: unless-stopped