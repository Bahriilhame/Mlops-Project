stages:

  prepare_features:
    cmd: python ml/prepare_data.py
    deps:
      - ml/prepare_data.py
      - oulad_pipeline.duckdb
    outs:
      - data/processed/clustering_features.csv
      - data/processed/scaler.joblib

  train_kmeans:
    cmd: python ml/clustering.py
    deps:
      - ml/clustering.py
      - oulad_pipeline.duckdb
      - data/processed/clustering_features.csv
    outs:
      - models/kmeans_final.joblib
      - data/processed/clustered_students.csv
      - data/processed/cluster_profiles.csv
      - data/processed/cluster_final_result_profile.csv
    metrics:
      - data/processed/kmeans_metrics.json:
          cache: false